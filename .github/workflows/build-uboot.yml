name: Build SM8150 U-Boot for Google Pixel 4
on:
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: U-Boot branch or commit
        required: true
        default: andrew/google-flame
  push:
    paths:
      - '.github/workflows/build-uboot.yml'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: flame-uboot
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UBOOT_SRC: https://gitlab.com/andrewgigena/u-boot.git
      UBOOT_REF: ${{ inputs.uboot_ref || 'andrew/google-flame' }}
      DEVICE: sm8150-google-flame
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu git libgnutls28-dev libncurses-dev libssl-dev make mkbootimg python3 python3-dev python3-setuptools swig gzip
      - name: Fetch device-specific U-Boot source and configure blkmap preboot
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "$UBOOT_REF" "$UBOOT_SRC" u-boot
          git -C u-boot log -1 --format='source_commit=%H%nsubject=%s' | tee stage-source.txt
          cd u-boot
          test -f board/qualcomm/qcom-phone.env
          python3 - <<'PY'
          from pathlib import Path
          p = Path("board/qualcomm/qcom-phone.env")
          lines = p.read_text().splitlines()
          dollar = chr(36)
          preboot = (
              "preboot=scsi scan; part start scsi 0 userdata userdata_start; "
              "part size scsi 0 userdata userdata_size; blkmap create root; "
              "blkmap map root 0 0x" + dollar + "{userdata_size} linear scsi 0 0x" + dollar + "{userdata_start}"
          )
          found = False
          output = []
          for line in lines:
              if line.startswith("preboot="):
                  if not found:
                      output.append(preboot)
                      found = True
              else:
                  output.append(line)
          if not found:
              output.append(preboot)
          p.write_text("\n".join(output) + "\n")
          if preboot not in p.read_text().splitlines():
              raise SystemExit("Failed to install blkmap preboot setting")
          PY
          cp board/qualcomm/qcom-phone.env ../qcom-phone.env
          cd ..
      - name: Build U-Boot and package Android boot image
        run: |
          set -euxo pipefail
          cd u-boot
          make mrproper
          make CROSS_COMPILE="$CROSS_COMPILE" O=.output qcom_defconfig qcom-phone.config "$DEVICE.config"
          make CROSS_COMPILE="$CROSS_COMPILE" O=.output -j"$(nproc)"
          DTB=".output/dts/upstream/src/arm64/qcom/$DEVICE.dtb"
          test -s .output/u-boot-nodtb.bin
          test -s "$DTB"
          gzip -n -c .output/u-boot-nodtb.bin > .output/u-boot-nodtb.bin.gz
          cat .output/u-boot-nodtb.bin.gz "$DTB" > .output/uboot-dtb
          mkbootimg --base '0x0' --kernel_offset '0x00008000' --pagesize '4096' --kernel .output/uboot-dtb -o .output/u-boot.img
          test -s .output/u-boot.img
          file .output/u-boot.img .output/u-boot-nodtb.bin .output/uboot-dtb
          cd "$GITHUB_WORKSPACE"
          mkdir -p stage/uboot
          cp u-boot/.output/u-boot.img stage/uboot/u-boot.img
          cp u-boot/.output/u-boot-nodtb.bin stage/uboot/
          cp u-boot/.output/u-boot-nodtb.bin.gz stage/uboot/
          cp u-boot/.output/uboot-dtb stage/uboot/
          cp "u-boot/.output/dts/upstream/src/arm64/qcom/$DEVICE.dtb" stage/uboot/sm8150-google-flame.dtb
          cp u-boot/.output/.config stage/uboot/uboot.config
          cp u-boot/board/qualcomm/qcom-phone.env stage/uboot/qcom-phone.env
          cp qcom-phone.env stage/uboot/qcom-phone.env
          cp stage-source.txt stage/uboot/SOURCE.txt
          cat > stage/uboot/BUILD-NOTES.txt <<EOF
          Target: Google Pixel 4 (google-flame), Qualcomm SM8150
          Source: $UBOOT_SRC
          Ref: $UBOOT_REF
          Device config: $DEVICE.config
          Android boot image: u-boot.img (built using the supplied mkbootimg offsets/page size)
          Preboot: scans UFS and exposes userdata as a blkmap device named root so its nested partition table can be scanned.
          Caution: this preboot layout expects boot files in storage backed by userdata. It does not mean U-Boot can read Android logical partitions inside super.
          This artifact is build-only. Do not flash until the target boot partition, current A/B slot, and restore method are confirmed.
          EOF
          (
            cd stage/uboot
            sha256sum u-boot.img u-boot-nodtb.bin u-boot-nodtb.bin.gz uboot-dtb sm8150-google-flame.dtb uboot.config qcom-phone.env SOURCE.txt BUILD-NOTES.txt > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: flame-uboot-${{ github.run_number }}
          path: stage/uboot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
