name: Build SM8150 U-Boot (reference)
on:
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: Branch, tag or commit from sm8150-mainline/u-boot
        required: true
        default: caleb/rbx-integration
      defconfig:
        description: U-Boot defconfig to build (review device support before use)
        required: true
        default: qcom_defconfig
  push:
    paths:
      - '.github/workflows/build-uboot.yml'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: flame-uboot
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UBOOT_SRC: https://gitlab.com/sm8150-mainline/u-boot.git
      UBOOT_REF: ${{ inputs.uboot_ref || 'caleb/rbx-integration' }}
      DEFCONFIG: ${{ inputs.defconfig || 'qcom_defconfig' }}
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu git libgnutls28-dev libncurses-dev libssl-dev make python3 python3-dev python3-setuptools swig
      - name: Fetch U-Boot source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none "$UBOOT_SRC" u-boot
          git -C u-boot checkout --detach "$UBOOT_REF"
          git -C u-boot log -1 --format='source_commit=%H%nsubject=%s' | tee stage-source.txt
          test -f "u-boot/configs/$DEFCONFIG"
          if [ -f u-boot/pixel4.txt ]; then cp u-boot/pixel4.txt stage-source-pixel4.txt; fi
      - name: Build U-Boot
        run: |
          set -euxo pipefail
          cd u-boot
          make CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"
          make -j"$(nproc)" CROSS_COMPILE="$CROSS_COMPILE"
          cd "$GITHUB_WORKSPACE"
          mkdir -p stage/uboot
          for f in \
            u-boot/u-boot.bin \
            u-boot/u-boot.elf \
            u-boot/u-boot-nodtb.bin \
            u-boot/u-boot-dtb.bin \
            u-boot/u-boot.dtb \
            u-boot/u-boot.itb \
            u-boot/u-boot.img \
            u-boot/u-boot-dtb.img \
            u-boot/spl/u-boot-spl.bin \
            u-boot/tpl/u-boot-tpl.bin \
            u-boot/pixel4.txt; do
            if [ -s "$f" ]; then
              cp --parents "$f" stage/uboot/
            fi
          done
          cp u-boot/.config stage/uboot/uboot.config
          mkdir -p stage/uboot/host-tools
          for f in u-boot/tools/mkimage u-boot/tools/mkeficapsule; do
            if [ -x "$f" ]; then cp "$f" stage/uboot/host-tools/; fi
          done
          test -s stage/uboot/u-boot/u-boot.bin -o -s stage/uboot/u-boot/u-boot.elf -o -s stage/uboot/u-boot/u-boot-nodtb.bin
          cp stage-source.txt stage/uboot/SOURCE.txt
          cat > stage/uboot/BUILD-NOTES.txt <<EOF
          Target device: Google Pixel 4 (google-flame), Qualcomm SM8150
          Source: $UBOOT_SRC
          Requested ref: $UBOOT_REF
          Defconfig: $DEFCONFIG
          This is a compile artifact only. It is NOT asserted to be a Pixel-4-ready Android boot image.
          Do not flash any output until image format, load address, entry point, ABL compatibility, and restore procedure are confirmed.
          EOF
          if [ -f stage-source-pixel4.txt ]; then cp stage-source-pixel4.txt stage/uboot/pixel4-source.txt; fi
          (
            cd stage/uboot
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: flame-uboot-reference-${{ github.run_number }}
          path: stage/uboot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
