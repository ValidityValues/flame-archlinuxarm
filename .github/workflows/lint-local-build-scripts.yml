name: Validate local build scripts
on:
  push:
    paths:
      - 'scripts/**'
      - 'flash.sh'
      - '.github/workflows/build-uboot.yml'
      - '.github/workflows/lint-local-build-scripts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check local rootfs and flash script syntax
        run: |
          bash -n scripts/build-rootfs.sh
          bash -n flash.sh
      - name: Confirm hosted rootfs builder is absent
        run: test ! -e .github/workflows/build-rootfs.yml
      - name: Check command-line validation and non-destructive flash target
        run: |
          bash scripts/build-rootfs.sh --help >/dev/null
          if bash scripts/build-rootfs.sh --desktop >/dev/null 2>&1; then
            echo "Expected a missing --desktop value to fail" >&2
            exit 1
          fi
          if bash scripts/build-rootfs.sh --size-mib >/dev/null 2>&1; then
            echo "Expected a missing --size-mib value to fail" >&2
            exit 1
          fi
          ! grep -Eq 'flash[[:space:]]+(userdata|super)([[:space:]]|$)' flash.sh
          grep -q 'flash "$TARGET_LP" "$IMAGE"' flash.sh
          grep -q 'Required SHA-256 file not found' flash.sh
      - name: Check required interfaces are present
        run: |
          grep -q 'rootfs.img' scripts/build-rootfs.sh
          grep -q 'download_cached' scripts/build-rootfs.sh
          grep -q 'PKG_CACHE="$OUT_DIR/pacman-cache"' scripts/build-rootfs.sh
          grep -q 'unmount_builder_mounts' scripts/build-rootfs.sh
          grep -q 'terminate_stale_chroot_processes' scripts/build-rootfs.sh
          grep -q 'umount -R "$ROOTFS/dev"' scripts/build-rootfs.sh
          grep -q 'Server = http://de3.mirror.archlinuxarm.org/' scripts/build-rootfs.sh
          grep -q 'ParallelDownloads = 1' scripts/build-rootfs.sh
          grep -q 'pipewire-jack' scripts/build-rootfs.sh
          grep -q -- '--disable-download-timeout' scripts/build-rootfs.sh
          grep -q -- '--disable-sandbox' scripts/build-rootfs.sh
          grep -q 'linux-firmware-qcom' scripts/build-rootfs.sh
          grep -q 'bluez-utils' scripts/build-rootfs.sh
          grep -q 'NetworkManager.service' scripts/build-rootfs.sh
          grep -q 'blkmap' docs/boot-layout.md
          ! grep -q 'ERASE USERDATA' flash.sh
          grep -q 'is-logical:' flash.sh
          grep -q 'flash "$TARGET_LP"' flash.sh
          ! grep -Eq 'flash[[:space:]]+super' flash.sh
