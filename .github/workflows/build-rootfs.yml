name: Build Arch Linux ARM rootfs
on:
  workflow_dispatch:
    inputs:
      desktop_environment:
        description: Desktop environment to install into the ARM64 rootfs
        type: choice
        required: true
        default: plasma-desktop
        options:
          - none
          - plasma-desktop
          - xfce4
          - lxqt
          - gnome
      image_size_mib:
        description: ext4 artifact size in MiB (not a statement of free space in super)
        type: choice
        required: true
        default: '6144'
        options:
          - '4096'
          - '6144'
          - '8192'
      ssh_public_key:
        description: Optional SSH public key only; never enter a private key
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/build-rootfs.yml'
      - 'README.md'
  schedule:
    - cron: '41 5 * * 0'
permissions:
  contents: read
concurrency:
  group: flame-rootfs
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ROOTFS_URL: https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
      SIZE_MIB: ${{ inputs.image_size_mib || '6144' }}
      DESKTOP: ${{ inputs.desktop_environment || 'plasma-desktop' }}
      SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host-side tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binfmt-support libarchive-tools curl e2fsprogs file gnupg qemu-user-static rsync zstd
          sudo update-binfmts --enable qemu-aarch64 || true
      - name: Download and verify Arch Linux ARM rootfs
        run: |
          set -euxo pipefail
          mkdir -p download rootfs stage
          FILE=ArchLinuxARM-aarch64-latest.tar.gz
          BASE="${ROOTFS_URL%/*}"
          curl -fL --retry 5 "$ROOTFS_URL" -o "download/$FILE"
          curl -fL --retry 5 "$BASE/$FILE.md5" -o "download/$FILE.md5"
          curl -fL --retry 5 "$BASE/$FILE.sig" -o "download/$FILE.sig"
          (cd download && md5sum -c "$FILE.md5")
          curl -fL --retry 5 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x68B3537F39A313B3E574D06777193F152BDBE6A6' | gpg --batch --import
          FPR="$(gpg --batch --with-colons --fingerprint 68B3537F39A313B3E574D06777193F152BDBE6A6 | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$FPR" = 68B3537F39A313B3E574D06777193F152BDBE6A6
          gpg --batch --verify "download/$FILE.sig" "download/$FILE"
          sudo bsdtar --numeric-owner --xattrs --acls -xpf "download/$FILE" -C rootfs
          file rootfs/usr/bin/bash | tee stage/rootfs-architecture.txt
          grep -E 'ARM aarch64|ARM64|AArch64' stage/rootfs-architecture.txt
      - name: Configure networking, Bluetooth, firmware and desktop
        run: |
          set -euxo pipefail
          case "$DESKTOP" in
            none)
              DE_PACKAGES=()
              DISPLAY_MANAGER=""
              ;;
            plasma-desktop)
              DE_PACKAGES=(plasma-desktop plasma-nm bluedevil dolphin konsole kate sddm xorg-server xorg-xwayland mesa vulkan-freedreno pipewire pipewire-alsa pipewire-pulse wireplumber xdg-desktop-portal xdg-desktop-portal-kde qt6-wayland)
              DISPLAY_MANAGER=sddm
              ;;
            xfce4)
              DE_PACKAGES=(xfce4-session xfce4-panel xfce4-settings xfdesktop xfwm4 xfce4-terminal thunar mousepad ristretto lightdm lightdm-gtk-greeter xorg-server xorg-xwayland mesa vulkan-freedreno)
              DISPLAY_MANAGER=lightdm
              ;;
            lxqt)
              DE_PACKAGES=(lxqt-session lxqt-panel lxqt-config lxqt-runner pcmanfm-qt qterminal sddm xorg-server xorg-xwayland mesa vulkan-freedreno qt6-wayland)
              DISPLAY_MANAGER=sddm
              ;;
            gnome)
              DE_PACKAGES=(gnome-shell gnome-session gdm gnome-terminal nautilus gnome-control-center gnome-settings-daemon gnome-keyring gnome-backgrounds gnome-tweaks xorg-xwayland mesa vulkan-freedreno)
              DISPLAY_MANAGER=gdm
              ;;
            *)
              echo "Unsupported desktop: $DESKTOP" >&2
              exit 2
              ;;
          esac
          {
            printf '%s\n' base base-devel sudo openssh git vim nano tmux usbutils e2fsprogs dosfstools device-mapper mkinitcpio
            printf '%s\n' networkmanager wpa_supplicant iwd wireless-regdb rfkill iw
            printf '%s\n' bluez bluez-utils
            printf '%s\n' linux-firmware-qcom linux-firmware-atheros linux-firmware-whence
            printf '%s\n' "${DE_PACKAGES[@]}"
          } | sed '/^$/d' | sort -u > stage/packages-to-install.txt
          printf '%s\n' "$DESKTOP" > stage/desktop-environment.txt
          printf '%s\n' "$DISPLAY_MANAGER" > stage/display-manager.txt
          sudo install -m 0755 /usr/bin/qemu-aarch64-static rootfs/usr/bin/qemu-aarch64-static
          # A temporary resolver is needed inside chroot; NetworkManager may replace it on first boot.
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee rootfs/etc/resolv.conf >/dev/null
          cleanup_mounts() {
            sudo umount rootfs/dev/pts 2>/dev/null || true
            sudo umount rootfs/dev 2>/dev/null || true
            sudo umount rootfs/proc 2>/dev/null || true
            sudo umount -R rootfs/sys 2>/dev/null || true
          }
          trap cleanup_mounts EXIT
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /dev/pts rootfs/dev/pts
          sudo mount -t proc proc rootfs/proc
          sudo mount --rbind /sys rootfs/sys
          sudo mount --make-rslave rootfs/sys
          mapfile -t PKGS < stage/packages-to-install.txt
          sudo chroot rootfs /usr/bin/pacman -Syu --noconfirm --needed "${PKGS[@]}"
          sudo chroot rootfs /usr/bin/pacman -Q > stage/packages-installed.txt
          sudo rm -f rootfs/usr/bin/qemu-aarch64-static
          sudo mkdir -p rootfs/etc/ssh/sshd_config.d rootfs/root/.ssh rootfs/etc/NetworkManager/conf.d rootfs/etc/flame rootfs/etc/systemd/system/multi-user.target.wants
          echo flame-arch | sudo tee rootfs/etc/hostname >/dev/null
          if [ -n "$SSH_PUBLIC_KEY" ]; then
            printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee rootfs/root/.ssh/authorized_keys >/dev/null
            sudo chmod 700 rootfs/root/.ssh
            sudo chmod 600 rootfs/root/.ssh/authorized_keys
            sudo chown -R 0:0 rootfs/root/.ssh
            printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n' | sudo tee rootfs/etc/ssh/sshd_config.d/90-flame.conf >/dev/null
            sudo ln -sf /usr/lib/systemd/system/sshd.service rootfs/etc/systemd/system/multi-user.target.wants/sshd.service
          else
            printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\n' | sudo tee rootfs/etc/ssh/sshd_config.d/90-flame.conf >/dev/null
            sudo rm -f rootfs/etc/systemd/system/multi-user.target.wants/sshd.service rootfs/etc/systemd/system/sockets.target.wants/sshd.socket
          fi
          sudo mkdir -p rootfs/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /usr/lib/systemd/system/NetworkManager.service rootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          sudo ln -sf /usr/lib/systemd/system/bluetooth.service rootfs/etc/systemd/system/multi-user.target.wants/bluetooth.service
          if [ -n "$DISPLAY_MANAGER" ]; then
            sudo ln -sf "/usr/lib/systemd/system/$DISPLAY_MANAGER.service" rootfs/etc/systemd/system/display-manager.service
            sudo ln -sf /usr/lib/systemd/system/graphical.target rootfs/etc/systemd/system/default.target
          else
            sudo ln -sf /usr/lib/systemd/system/multi-user.target rootfs/etc/systemd/system/default.target
          fi
          sudo tee rootfs/etc/NetworkManager/conf.d/10-wifi.conf >/dev/null <<'EOF'
          [device]
          wifi.backend=wpa_supplicant
          EOF
          sudo tee rootfs/etc/flame/BUILD_INFO >/dev/null <<EOF
          Device: Google Pixel 4 (google-flame)
          Userspace: Arch Linux ARM AArch64
          Desktop: $DESKTOP
          Network manager: NetworkManager (wpa_supplicant backend)
          Bluetooth: BlueZ; bluetooth.service enabled
          Wi-Fi firmware packages: linux-firmware-qcom, linux-firmware-atheros, linux-firmware-whence
          Kernel/DTB/modules: build from ValidityValues/linux-sm8150-mainline as matching artifacts
          U-Boot: build separately with the Build SM8150 U-Boot workflow
          Hardware Wi-Fi/BT and boot: not yet validated on physical device
          EOF
          sudo chown -R 0:0 rootfs/etc/flame
          sudo chown -R "$USER":"$USER" stage
          cleanup_mounts
          trap - EXIT
          sudo find rootfs/var/cache/pacman/pkg -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true
          sudo find rootfs/var/log/journal -mindepth 1 -delete 2>/dev/null || true
          {
            find rootfs/usr/lib/firmware/ath10k/WCN3990 -type f 2>/dev/null || true
            find rootfs/usr/lib/firmware/qca -type f 2>/dev/null || true
            find rootfs/usr/lib/firmware/qcom/sm8150 -type f 2>/dev/null || true
          } | sed 's#^rootfs##' | sort -u > stage/firmware-audit.txt
          sudo chown "$USER":"$USER" stage/firmware-audit.txt
          sudo chown "$USER":"$USER" stage/packages-installed.txt
      - name: Create rootfs archive and standalone ext4 image
        run: |
          set -euxo pipefail
          [[ "$SIZE_MIB" =~ ^[0-9]+$ ]] && (( SIZE_MIB >= 4096 ))
          USED_MIB="$(sudo du -sm rootfs | cut -f1)"
          RESERVE_MIB=$(( SIZE_MIB / 10 ))
          if (( USED_MIB + RESERVE_MIB > SIZE_MIB )); then
            echo "Rootfs uses ${USED_MIB} MiB; image size ${SIZE_MIB} MiB leaves less than 10% free. Rerun with a larger image size." >&2
            exit 1
          fi
          sudo tar --numeric-owner --xattrs --acls --use-compress-program='zstd -T0 -10' -cf stage/flame-rootfs.tar.zst -C rootfs .
          truncate -s "${SIZE_MIB}M" stage/rootfs.img
          mkfs.ext4 -F -q -L FLAME_ROOT -m 0 -E lazy_itable_init=0,lazy_journal_init=0 stage/rootfs.img
          mkdir mnt-rootfs
          sudo mount -o loop stage/rootfs.img mnt-rootfs
          sudo rsync -aHAX --numeric-ids rootfs/ mnt-rootfs/
          sync
          df -h mnt-rootfs | tee stage/ext4-space.txt
          sudo umount mnt-rootfs
          sudo e2fsck -fn stage/rootfs.img
          zstd -T0 -10 -f stage/rootfs.img -o stage/rootfs.img.zst
          rm -f stage/rootfs.img
          printf 'device=google-flame\ndistribution=Arch Linux ARM AArch64\ndesktop=%s\nsize_mib=%s\nfilesystem_image=rootfs.img.zst (decompress to rootfs.img)\nformat=ext4\nnetwork=NetworkManager+wpa_supplicant\nbluetooth=BlueZ\nboot=requires separate U-Boot-accessible kernel/FIT path; see docs/boot-layout.md\nstatus=ROOTFS_BUILD_ONLY_NOT_HARDWARE_VALIDATED\nwarning=Do not flash this standalone ext4 image to physical super. Create a dedicated logical partition only after LP metadata is backed up and reviewed.\n' "$DESKTOP" "$SIZE_MIB" > stage/MANIFEST.txt
          (
            cd stage
            sha256sum flame-rootfs.tar.zst rootfs.img.zst packages-installed.txt packages-to-install.txt firmware-audit.txt > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: flame-archlinuxarm-rootfs-${{ inputs.desktop_environment || 'plasma-desktop' }}-${{ github.run_number }}
          path: |
            stage/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
